# Render Blueprint: one free web service running the single-image Dockerfile
# (the API serves the built web app on the same origin). See DEPLOY.md.
services:
  - type: web
    name: taskflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Generated by Render on first deploy; never stored in the repository.
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: SEED_ON_START
        value: 'true'
      # The free plan has no persistent disk, so the demo reseeds itself on boot and every hour.
      - key: DEMO_RESET_INTERVAL_MINUTES
        value: '60'
