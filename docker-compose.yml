# One command: docker compose up --build  ->  http://localhost:8080
# Demo login: demo@taskflow.dev / Demo123!
#
# JWT_SECRET: set it in a local .env file (see .env.example). If it is not set, the API
# generates a random secret per start (sessions end when the container restarts).

name: taskflow

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOW_EPHEMERAL_JWT_SECRET: "true"
      COOKIE_SECURE: "false"
      SEED_ON_START: "true"
      DEMO_RESET_INTERVAL_MINUTES: ${DEMO_RESET_INTERVAL_MINUTES:-0}
    volumes:
      - taskflow-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taskflow-data:
