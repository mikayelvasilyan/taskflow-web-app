name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test-api:
    name: API tests (with coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Coverage thresholds (80% lines/functions/statements, 75% branches) are enforced in api/vitest.config.ts.
      - run: npm test --workspace api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: api/coverage
          retention-days: 14

  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test --workspace web

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (docker compose up)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          B=http://localhost:8080
          curl -fsS "$B/api/health" | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "$B/app/dashboard"
          curl -fsS -o /dev/null "$B/docs/openapi.json"
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"email":"demo@taskflow.dev","password":"Demo123!"}' "$B/api/auth/login" > /dev/null
          curl -fsS -b jar "$B/api/projects" | grep -q '"key":"WEB"'
          # Test-only routes must not exist in production mode.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/api/test/reset")" = "404"
          echo "Smoke test passed"
      - name: Test-mode override exposes seed endpoints
        run: |
          set -euo pipefail
          docker compose down
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --wait --wait-timeout 180
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4000/api/test/seed | grep -q '"scenario":"workspace"'
      - name: Single-image build (API serves the web app)
        run: |
          set -euo pipefail
          docker build -t taskflow-single .
          docker run -d --name single -p 4100:4000 -e JWT_SECRET="$(openssl rand -hex 32)" taskflow-single
          for _ in $(seq 1 30); do curl -fsS http://localhost:4100/api/health && break; sleep 2; done
          curl -fsS http://localhost:4100/login | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v || true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner -v
